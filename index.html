<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ফ্রিল্যান্স ট্র্যাকার</title>
<meta name="theme-color" content="#e8421c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ট্র্যাকার">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#2a1610;--mute:#85685c;--line:#f2dfd5;--acc:#e8421c;--acc2:#ffe6da;--g:#12805c;--c1bg:#fff1d6;--c1fg:#8a5600;--c2bg:#dcf4ea;--c2fg:#0d6a4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f0b;--card:#26160f;--ink:#fbeee7;--mute:#bf9d8e;--line:#3d2519;--acc:#ff7a45;--acc2:#432316;--g:#4cc9a0;--c1bg:#4a3410;--c1fg:#f0b34a;--c2bg:#123c30;--c2fg:#4cc9a0}}
:root[data-theme="dark"]{--bg:#1a0f0b;--card:#26160f;--ink:#fbeee7;--mute:#bf9d8e;--line:#3d2519;--acc:#ff7a45;--acc2:#432316;--g:#4cc9a0;--c1bg:#4a3410;--c1fg:#f0b34a;--c2bg:#123c30;--c2fg:#4cc9a0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.hero{position:relative;background:linear-gradient(135deg,#ff8a1f,#e8341c);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.logo{position:absolute;right:14px;top:14px;width:60px;height:60px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.hero p{margin:0;opacity:.9;font-size:14px}.hero b{font-size:24px;display:block}
.hero .bar{background:rgba(255,255,255,.3);margin:10px 0 4px}.hero .bar i{background:#fff!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px;font-size:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:var(--acc2);color:var(--acc)}button.x{background:none;color:var(--mute);padding:4px 8px;font-size:18px}
button.full{width:100%;margin-top:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}.item .t{flex:1;min-width:0}.item small{color:var(--mute);display:block}
.done{text-decoration:line-through;color:var(--mute)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;border-radius:6px}
.lh{display:flex;justify-content:space-between;font-size:14px}
.chip{border:0;border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600;background:var(--acc2);color:var(--acc)}
.chip.s1{background:var(--c1bg);color:var(--c1fg)}.chip.s2{background:var(--c2bg);color:var(--c2fg)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mute);padding:8px 2px;font-size:14px}nav button.on{color:var(--acc);background:var(--acc2)}
.empty{color:var(--mute);text-align:center;padding:14px 0;font-size:14px}
.big{font-size:26px;font-weight:700}.msg{color:var(--g);font-size:14px;margin-top:8px}
.tm{font-size:30px;font-weight:700;text-align:center;margin:6px 0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var CATS=[{k:"mp",n:"মার্কেটপ্লেস",c:"#e8421c"},{k:"hunt",n:"ক্লায়েন্ট হান্টিং",c:"#f59e0b"},{k:"proj",n:"রানিং প্রজেক্ট",c:"#12805c"}];
var SERV=["গুগল অ্যাডস","ফেসবুক অ্যাডস","কনভার্সন ট্র্যাকিং","অন্যান্য"];
var STAT=["চলছে","ডেলিভারি দেওয়া","সম্পন্ন"];
var TABS=[["today","আজ"],["tasks","কাজ"],["orders","অর্ডার"],["report","রিপোর্ট"],["set","সেটিংস"]];
var D={logs:[],tasks:[],orders:[],set:{name:"",cur:"৳",goal:4,theme:"auto"},timer:null},tab="today",note="",tick=null,armed=false;
try{var s=localStorage.getItem("fl_data");if(s){var p=JSON.parse(s);for(var k in p)D[k]=p[k];}}catch(e){}
function save(){try{localStorage.setItem("fl_data",JSON.stringify(D))}catch(e){}}
function theme(){var r=document.documentElement;if(D.set.theme=="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",D.set.theme)}
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function fm(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;return h?bn(h)+" ঘণ্টা"+(r?" "+bn(r)+" মিনিট":""):bn(r)+" মিনিট"}
function dk(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
function catName(k){return CATS.filter(function(c){return c.k==k})[0].n}
function sum(k,date){return D.logs.filter(function(l){return (!k||l.cat==k)&&l.date==date}).reduce(function(a,l){return a+l.mins},0)}
function streak(){var n=0,d=new Date();if(!sum(0,dk(d)))d.setDate(d.getDate()-1);while(sum(0,dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function cur(){return D.set.cur}

function today(){
 var t=dk(),tot=sum(0,t),goal=(+D.set.goal||0)*60,h="";
 h+='<div class="hero"><img class="logo" src="'+LOGO+'" alt="লোগো"><p>'+(D.set.name?'হ্যালো, '+esc(D.set.name):'আজকের কাজের সময়')+'</p><b>'+fm(tot)+'</b>';
 if(goal)h+='<div class="bar"><i style="width:'+Math.min(100,tot/goal*100)+'%"></i></div><p>লক্ষ্য '+fm(goal)+(tot>=goal?' · পূরণ হয়েছে':'')+(streak()?' · টানা '+bn(streak())+' দিন':'')+'</p>';
 h+='</div>';
 if(!D.hideInst)h+=inst(true);
 if(D.timer){h+='<div class="card"><h2>টাইমার চলছে · '+catName(D.timer.cat)+'</h2><div class="tm" id="tm">00:00</div><button class="full" onclick="stopT()">থামান ও সেভ করুন</button></div>'}
 else{h+='<div class="card"><h2>টাইমার</h2><label>কোথায় সময় দিচ্ছেন</label><select id="tc">'+CATS.map(function(c){return '<option value="'+c.k+'">'+c.n+'</option>'}).join("")+'</select><label>নাম (মার্কেটপ্লেস / ক্লায়েন্ট)</label><input id="tn" placeholder="যেমন: Fiverr"><button class="full" onclick="startT()">টাইমার চালু করুন</button></div>'}
 h+='<div class="card"><h2>খাত অনুযায়ী আজ</h2>';
 CATS.forEach(function(c){var m=sum(c.k,t);h+='<div class="lh"><span>'+c.n+'</span><b>'+fm(m)+'</b></div><div class="bar"><i style="width:'+Math.min(100,m/240*100)+'%;background:'+c.c+'"></i></div>'});
 h+='</div><div class="card"><h2>হাতে সময় যোগ করুন</h2><select id="lc">'+CATS.map(function(c){return '<option value="'+c.k+'">'+c.n+'</option>'}).join("")+'</select>';
 h+='<label>নাম (ঐচ্ছিক)</label><input id="ln" placeholder="যেমন: Upwork, LinkedIn"><div class="row"><div><label>ঘণ্টা</label><input id="lh" type="number" min="0" inputmode="numeric" value="0"></div><div><label>মিনিট</label><input id="lm" type="number" min="0" max="59" inputmode="numeric" value="30"></div></div>';
 h+='<button class="full" onclick="addLog()">সময় সেভ করুন</button></div>';
 var L=D.logs.filter(function(l){return l.date==t}).reverse();
 h+='<div class="card"><h2>আজকের তালিকা</h2>';
 h+=L.length?L.map(function(l){return '<div class="item"><div class="t">'+catName(l.cat)+(l.note?' · '+esc(l.note):'')+'<small>'+fm(l.mins)+'</small></div><button class="x" aria-label="মুছুন" onclick="del(\'logs\','+l.id+')">×</button></div>'}).join(""):'<div class="empty">আজ এখনো কোনো সময় যোগ করেননি</div>';
 return h+'</div>';
}
function addLog(){var m=(+$("lh").value||0)*60+(+$("lm").value||0);if(m<=0)return;
 D.logs.push({id:Date.now(),date:dk(),cat:$("lc").value,note:$("ln").value.trim(),mins:m});save();render()}
function startT(){D.timer={cat:$("tc").value,note:$("tn").value.trim(),t0:Date.now()};save();render()}
function stopT(){var m=Math.max(1,Math.round((Date.now()-D.timer.t0)/60000));D.logs.push({id:Date.now(),date:dk(),cat:D.timer.cat,note:D.timer.note,mins:m});D.timer=null;save();render()}
function tickT(){var e=$("tm");if(!e||!D.timer)return;var s=Math.floor((Date.now()-D.timer.t0)/1000),f=function(n){return ("0"+n).slice(-2)};e.textContent=bn(f(Math.floor(s/3600))+":"+f(Math.floor(s/60)%60)+":"+f(s%60))}

function tasks(){
 var h='<h1>করণীয় কাজ</h1><p class="sub">'+bn(D.tasks.filter(function(t){return !t.done}).length)+'টি কাজ বাকি</p>';
 h+='<div class="card"><label>নতুন কাজ</label><input id="tt" placeholder="যেমন: ক্লায়েন্টের পিক্সেল সেট করা"><label>শেষ তারিখ (ঐচ্ছিক)</label><input id="td" type="date"><button class="full" onclick="addTask()">কাজ যোগ করুন</button></div><div class="card">';
 var T=D.tasks.slice().sort(function(a,b){return a.done-b.done});
 h+=T.length?T.map(function(t){return '<div class="item"><input type="checkbox" style="width:22px;height:22px" '+(t.done?'checked':'')+' onchange="tog('+t.id+')"><div class="t '+(t.done?'done':'')+'">'+esc(t.text)+(t.due?'<small>শেষ তারিখ: '+bn(t.due)+'</small>':'')+'</div><button class="x" aria-label="মুছুন" onclick="del(\'tasks\','+t.id+')">×</button></div>'}).join(""):'<div class="empty">কোনো কাজ নেই। উপরে একটি যোগ করুন</div>';
 return h+'</div>';
}
function addTask(){var v=$("tt").value.trim();if(!v)return;D.tasks.push({id:Date.now(),text:v,due:$("td").value,done:false});save();render()}
function tog(id){D.tasks.forEach(function(t){if(t.id==id)t.done=!t.done});save();render()}

function orders(){
 var run=D.orders.filter(function(o){return o.st<2}).length;
 var h='<h1>অর্ডার</h1><p class="sub">'+bn(run)+'টি অর্ডার চলছে</p><div class="card"><h2>নতুন অর্ডার</h2>';
 h+='<label>ক্লায়েন্টের নাম</label><input id="oc"><label>সার্ভিস</label><select id="os">'+SERV.map(function(s){return '<option>'+s+'</option>'}).join("")+'</select>';
 h+='<label>কোথা থেকে পেয়েছেন</label><input id="om" placeholder="Fiverr, Upwork, সরাসরি...">';
 h+='<div class="row"><div><label>টাকা ('+cur()+')</label><input id="op" type="number" inputmode="numeric"></div><div><label>ডেলিভারি তারিখ</label><input id="od" type="date"></div></div>';
 h+='<button class="full" onclick="addOrder()">অর্ডার যোগ করুন</button></div><div class="card">';
 h+=D.orders.length?D.orders.slice().reverse().map(function(o){return '<div class="item"><div class="t"><b>'+esc(o.client)+'</b> · '+o.serv+'<small>'+(o.mk?esc(o.mk)+' · ':'')+cur()+bn(o.price||0)+(o.due?' · ডেলিভারি '+bn(o.due):'')+'</small></div><button class="chip s'+o.st+'" onclick="nextSt('+o.id+')">'+STAT[o.st]+'</button><button class="x" aria-label="মুছুন" onclick="del(\'orders\','+o.id+')">×</button></div>'}).join(""):'<div class="empty">এখনো কোনো অর্ডার নেই</div>';
 return h+'</div><p class="sub">অবস্থা বদলাতে স্ট্যাটাস বাটনে ট্যাপ করুন</p>';
}
function addOrder(){var c=$("oc").value.trim();if(!c)return;
 D.orders.push({id:Date.now(),client:c,serv:$("os").value,mk:$("om").value.trim(),price:+$("op").value||0,due:$("od").value,st:0});save();render()}
function nextSt(id){D.orders.forEach(function(o){if(o.id==id)o.st=(o.st+1)%3});save();render()}

function report(){
 var days=[],i;for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(dk(d))}
 var h='<h1>রিপোর্ট</h1><p class="sub">গত ৭ দিন</p><div class="card">';
 var tots=CATS.map(function(c){var m=0;days.forEach(function(d){m+=sum(c.k,d)});return m}),mx=Math.max(1,Math.max.apply(null,tots));
 CATS.forEach(function(c,j){h+='<div class="lh"><span>'+c.n+'</span><b>'+fm(tots[j])+'</b></div><div class="bar"><i style="width:'+tots[j]/mx*100+'%;background:'+c.c+'"></i></div>'});
 h+='</div><div class="card"><h2>দিনভিত্তিক মোট</h2>';
 days.forEach(function(d){var m=sum(0,d);h+='<div class="lh"><span>'+bn(d)+'</span><b>'+fm(m)+'</b></div><div class="bar"><i style="width:'+Math.min(100,m/480*100)+'%;background:var(--acc)"></i></div>'});
 var earn=D.orders.filter(function(o){return o.st==2}).reduce(function(a,o){return a+(o.price||0)},0);
 var pend=D.orders.filter(function(o){return o.st<2}).reduce(function(a,o){return a+(o.price||0)},0);
 return h+'</div><div class="card"><div class="lh"><span>সম্পন্ন অর্ডার থেকে আয়</span></div><div class="big" style="color:var(--g)">'+cur()+bn(earn)+'</div><div class="lh" style="margin-top:8px"><span>চলমান অর্ডারের মোট টাকা</span><b>'+cur()+bn(pend)+'</b></div></div>';
}

function sett(){
 var h='<h1>সেটিংস</h1><p class="sub">আপনার ডেটা শুধু আপনার এই ডিভাইসেই থাকে</p><div class="card">';
 h+='<label>আপনার নাম</label><input id="sn" value="'+esc(D.set.name)+'" placeholder="নাম লিখুন">';
 h+='<div class="row"><div><label>টাকার চিহ্ন</label><select id="sc"><option'+(D.set.cur=="৳"?" selected":"")+'>৳</option><option'+(D.set.cur=="$"?" selected":"")+'>$</option></select></div><div><label>দৈনিক লক্ষ্য (ঘণ্টা)</label><input id="sg" type="number" min="0" step="0.5" inputmode="decimal" value="'+D.set.goal+'"></div></div>';
 h+='<label>থিম</label><select id="st"><option value="auto"'+(D.set.theme=="auto"?" selected":"")+'>ফোনের মতো</option><option value="light"'+(D.set.theme=="light"?" selected":"")+'>হালকা</option><option value="dark"'+(D.set.theme=="dark"?" selected":"")+'>গাঢ়</option></select>';
 h+='<button class="full" onclick="saveSet()">সেটিংস সেভ করুন</button><div class="msg" id="sm"></div></div>';
 h+='<div class="card"><h2>ব্যাকআপ ও রিস্টোর</h2><p class="sub">নিচের লেখা কপি করে কোথাও রেখে দিন। নতুন ফোনে এখানে পেস্ট করে রিস্টোর করুন।</p><textarea id="bk" aria-label="ব্যাকআপ">'+esc(JSON.stringify(D))+'</textarea><div class="row" style="margin-top:8px"><button class="ghost" onclick="copyBk()">কপি করুন</button><button onclick="restore()">রিস্টোর করুন</button></div><div class="msg" id="bm"></div></div>';
 h+=inst(false);
 h+='<div class="card"><h2>সব ডেটা মুছুন</h2><button class="ghost full" id="rs" onclick="reset()">সব মুছে ফেলুন</button></div>';
 return h;
}
function saveSet(){D.set.name=$("sn").value.trim();D.set.cur=$("sc").value;D.set.goal=+$("sg").value||0;D.set.theme=$("st").value;save();theme();$("sm").textContent="সেভ হয়েছে";}
function copyBk(){var t=$("bk");t.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}$("bm").textContent=ok?"কপি হয়েছে":"লেখাটি সিলেক্ট করে নিজে কপি করুন"}
function restore(){try{var p=JSON.parse($("bk").value);if(!p.logs||!p.tasks||!p.orders)throw 0;D=p;if(!D.set)D.set={name:"",cur:"৳",goal:4,theme:"auto"};save();theme();render()}catch(e){$("bm").textContent="লেখাটি ঠিক নেই। ব্যাকআপের পুরো লেখা পেস্ট করুন"}}
function reset(){if(!armed){armed=true;$("rs").textContent="নিশ্চিত? আবার ট্যাপ করুন";return}
 armed=false;D={logs:[],tasks:[],orders:[],set:D.set,timer:null};save();render()}

function inst(hideable){var st=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;if(st)return "";
 return '<div class="card"><h2>ফোনে অ্যাপ হিসেবে ইনস্টল করুন</h2><p class="sub">হোম স্ক্রিনের আইকন থেকে সরাসরি খুলবে, ব্রাউজার বার ছাড়াই।</p><div class="row"><button onclick="installApp()">অ্যাপ ইনস্টল করুন</button>'+(hideable?'<button class="ghost" onclick="hideInst()">পরে</button>':'')+'</div><div class="msg" id="im"></div></div>'}
function hideInst(){D.hideInst=true;save();render()}
function installApp(){var m=$("im");
 if(dp){dp.prompt();dp.userChoice.then(function(){dp=null});return}
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 m.textContent=ios?"Safari-তে নিচের Share বাটন চাপুন, তারপর “Add to Home Screen” বেছে নিন।":"Chrome-এর ⋮ মেনু খুলে “Add to Home screen” বা “Install app” চাপুন। Claude অ্যাপের ভেতরে খুললে আগে লিংকটা Chrome বা Safari-তে খুলুন।"}
function render(){
 $("app").innerHTML={today:today,tasks:tasks,orders:orders,report:report,set:sett}[tab]();
 $("nav").innerHTML=TABS.map(function(t){return '<button class="'+(t[0]==tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
 tickT();
}
function go(t){tab=t;armed=false;render();window.scrollTo(0,0)}
theme();render();setInterval(tickT,1000);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
